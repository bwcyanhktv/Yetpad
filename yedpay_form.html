<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yedpay 收費通知產生器 - MCC分區管理系統</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #f0f5ff 0%, #f4f8fc 50%, #f9fbff 100%);
            color: #1e293b;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .page-container {
            max-width: 650px;
            margin: 0 auto;
        }

        /* 頂部返回與標題 */
        .header-nav {
            margin-bottom: 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #2563eb;
        }

        .page-title-box h1 {
            font-size: 26px;
            color: #0f172a;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .page-title-box p {
            font-size: 13px;
            color: #64748b;
        }

        /* 表單大卡片 */
        .form-card {
            background: #ffffff;
            border: 1px solid rgba(215, 228, 245, 0.85);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.05);
            margin-top: 20px;
        }

        .section-heading {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f1f5f9;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
        }

        .form-group label span {
            color: #ef4444;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            color: #0f172a;
            background: #f8fafc;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #3b82f6;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        select.form-control {
            cursor: pointer;
        }

        /* 按鈕群組 */
        .btn-row {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-preview {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .btn-preview:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .btn-whatsapp {
            background: #25d366;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            background: #22bf5b;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }

        /* 提示資訊框 */
        .tip-card {
            background: rgba(254, 243, 199, 0.6);
            border: 1px solid rgba(252, 211, 77, 0.6);
            border-radius: 14px;
            padding: 16px 20px;
            margin-top: 25px;
            font-size: 12.5px;
            color: #92400e;
            line-height: 1.6;
        }

        /* 預覽 Modal 彈窗 */
        #preview-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-header h3 {
            font-size: 18px;
            color: #0f172a;
        }

        .close-modal {
            font-size: 24px;
            color: #94a3b8;
            cursor: pointer;
        }

        .preview-box {
            background: #e7fed0;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 16px;
            font-family: monospace;
            font-size: 13.5px;
            color: #166534;
            white-space: pre-wrap;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        @media (max-width: 600px) {
            .btn-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        
        <!-- 導航返回 -->
        <div class="header-nav">
            <a href="index.html" class="back-link">← 返回主頁</a>
            <div class="page-title-box">
                <h1>Yedpay 收費</h1>
                <p>填寫收費資料並發送 WhatsApp 通知給 OSC</p>
            </div>
        </div>

        <!-- 主表單卡片 -->
        <div class="form-card">
            <div class="section-heading">收費資料</div>
            
            <form id="yedpayForm" onsubmit="event.preventDefault(); sendWhatsApp();">
                <!-- 停車場 -->
                <div class="form-group">
                    <label>停車場 <span>*</span></label>
                    <select id="carpark" class="form-control" required>
                        <option value="" disabled selected>選擇停車場</option>
                        <option value="International Gateway Center (IGC)">International Gateway Center (IGC)</option>
                        <option value="其他場區">其他場區</option>
                    </select>
                </div>

                <!-- 車牌 -->
                <div class="form-group">
                    <label>車牌 <span>*</span></label>
                    <input type="text" id="carPlate" class="form-control" placeholder="例：AB1234" required>
                </div>

                <!-- 收 SMS 電話 -->
                <div class="form-group">
                    <label>收 SMS 電話 <span>*</span></label>
                    <input type="tel" id="smsPhone" class="form-control" placeholder="例：+852 98540066" required>
                </div>

                <!-- 費用 -->
                <div class="form-group">
                    <label>費用 ($) <span>*</span></label>
                    <input type="number" id="feeAmount" class="form-control" placeholder="例：50" required>
                </div>

                <!-- 收費原因 -->
                <div class="form-group">
                    <label>收費原因 <span>*</span></label>
                    <select id="feeReason" class="form-control" required>
                        <option value="" disabled selected>選擇收費原因</option>
                        <option value="遺失票卡 / 補票費">遺失票卡 / 補票費</option>
                        <option value="超時泊車補繳">超時泊車補繳</option>
                        <option value="其他行政收費">其他行政收費</option>
                    </select>
                </div>

                <!-- 按鈕群組 -->
                <div class="btn-row">
                    <button type="button" class="btn btn-preview" onclick="previewMessage()">預覽消息</button>
                    <button type="submit" class="btn btn-whatsapp">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.124-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                        發送 WhatsApp
                    </button>
                </div>
            </form>

            <!-- 底部提示 -->
            <div class="tip-card">
                💡 <strong>提示：</strong> 點擊「發送 WhatsApp」後，系統會打開你的手機 WhatsApp 應用，消息內容已預先填好，你只需按「發送」即可。消息會發送給 OSC (WhatsApp：<strong>98540066</strong>)。訊息開頭會自動添加「麻煩幫我發送Yedpay付款連結：」。
            </div>
        </div>

    </div>

    <!-- 預覽彈窗 -->
    <div id="preview-modal" onclick="closePreview(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>預覽 WhatsApp 訊息</h3>
                <span class="close-modal" onclick="closePreview()">&times;</span>
            </div>
            <div id="previewText" class="preview-box"></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-whatsapp" onclick="sendWhatsApp(); closePreview();">確認並發送 WhatsApp</button>
            </div>
        </div>
    </div>

    <script>
        function generateMessage() {
            const carpark = document.getElementById('carpark').value || '[未選擇停車場]';
            const carPlate = document.getElementById('carPlate').value || '[未填寫車牌]';
            const smsPhone = document.getElementById('smsPhone').value || '[未填寫電話]';
            const feeAmount = document.getElementById('feeAmount').value || '[未填寫金額]';
            const feeReason = document.getElementById('feeReason').value || '[未選擇原因]';

            return `麻煩幫我發送Yedpay付款連結：\n\n停車場：${carpark}\n車牌：${carPlate}\n收 SMS 電話：${smsPhone}\n費用：$${feeAmount}\n收費原因：${feeReason}`;
        }

        function previewMessage() {
            const form = document.getElementById('yedpayForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            document.getElementById('previewText').innerText = generateMessage();
            document.getElementById('preview-modal').style.display = 'flex';
        }

        function closePreview() {
            document.getElementById('preview-modal').style.display = 'none';
        }

        function sendWhatsApp() {
            const form = document.getElementById('yedpayForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const message = generateMessage();
            const oscPhone = "85298540066"; // OSC 電話號碼 (去咗 + 號方便 wa.me 連結)
            const encodedMessage = encodeURIComponent(message);
            
            // 開啟 WhatsApp 官方連結 (支援流動版及網頁版)
            const whatsappUrl = `https://wa.me/${oscPhone}?text=${encodedMessage}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
